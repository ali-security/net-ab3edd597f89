# Upstream golang.org/x/net has no GitHub Actions CI (it is tested on the Go
# project's own TryBot/LUCI infrastructure), so this workflow is written from
# scratch. It packages the module zip exactly as the module proxy does and runs
# the project's own test suite (`go test ./...`) on Linux, macOS and Windows.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Go package pattern(s) to test instead of ./...'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      # Build the packaging helper in its own module OUTSIDE the checkout, so
      # `go get` never touches this repository's go.mod/go.sum.
      - name: Build module-zip helper
        run: |
          set -eux
          HELPER=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
          cd "$HELPER"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" .

      # golang.org/x/mod/zip skips .git but DESCENDS into .github, so this
      # workflow would otherwise leak into the zip as extra entries that the
      # public proxy artifact does not have. .gitignore is kept: it IS part of
      # the published module zip.
      - name: Create module zip
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/out"
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" \
            golang.org/x/net v0.34.0 \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/out/v0.34.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.34.0.zip" | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.34.0.zip
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go 1.23 was the current release when v0.34.0 shipped (2025-01-06);
          # 1.22 was the other supported release. Go 1.21 was already
          # unsupported and hangs http2.TestServer_Rejects_Too_Many_Streams.
          - os: ubuntu-latest
            go: '1.23'
            race: '-race'
          - os: ubuntu-latest
            go: '1.22'
            race: '-race'
          - os: macos-latest
            go: '1.23'
            race: ''
          - os: windows-latest
            go: '1.23'
            race: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # Windows would otherwise default to pwsh, where `set -eux` fails.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: |
          set -eux
          go build ./...

      # -v so every test reports its own PASS/FAIL/SKIP line; the summary step
      # states how many tests passed. The exit status of `go test` is
      # propagated unchanged.
      - name: Test
        run: |
          set -euo pipefail
          go test -v ${{ matrix.race }} ${{ inputs.test-filter || './...' }} 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      - name: Test summary
        if: always()
        run: |
          set -eu
          awk '
            { sub(/\r$/, "") }
            /^(ok|FAIL|\?)[ \t]/ { print }
            /^ok[ \t]/ { pok++ }
            /^FAIL[ \t]/ { pfail++ }
            /^[ \t]*--- PASS/ { pass++ }
            /^[ \t]*--- FAIL/ { fail++ }
            /^[ \t]*--- SKIP/ { skip++ }
            END {
              print "==== go test summary ===="
              printf "packages ok: %d, packages FAIL: %d\n", pok, pfail
              printf "tests passed: %d, failed: %d, skipped: %d\n", pass, fail, skip
            }
          ' "$RUNNER_TEMP/go-test.log"

      # go test -v prints a skipped test's t.Skip message on an indented
      # "file.go:N: msg" line, often far from its "--- SKIP" line. Pair them up
      # by test name so every skipped test is listed with its reason.
      - name: Skipped tests with reasons
        if: always()
        run: |
          set -eu
          awk '
            { sub(/\r$/, "") }
            /^=== (RUN|CONT|NAME|PAUSE)[ \t]/ { cur = $3; next }
            /^[ \t]+[A-Za-z0-9_]+(_test)?\.go:[0-9]+: / {
              if (cur != "" && !(cur in reason)) {
                m = $0; sub(/^[ \t]+[^ ]+: /, "", m); reason[cur] = m
              }
              next
            }
            /^[ \t]*--- SKIP: / {
              name = $3
              r = (name in reason) ? reason[name] : "(no message)"
              printf "SKIPPED %s -- reason: %s\n", name, r
              count[r]++
              n++
            }
            END {
              print "==== skipped tests by reason ===="
              for (r in count) printf "%6d  %s\n", count[r], r
              printf "total skipped: %d\n", n
            }
          ' "$RUNNER_TEMP/go-test.log"
